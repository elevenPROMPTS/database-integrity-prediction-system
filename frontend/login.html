<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Integrity System | Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101827,#1e3a5f);font-family:Arial,sans-serif;color:#172033}.login-box{width:min(92%,390px);background:#fff;padding:34px;border-radius:18px;box-shadow:0 20px 60px #0005}.eyebrow{color:#2563eb;font-size:12px;font-weight:bold;letter-spacing:1.5px}h1{font-size:25px;margin:9px 0}p{color:#64748b;font-size:14px;line-height:1.5}label{display:block;font-size:13px;font-weight:bold;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}#message{min-height:20px;margin-top:14px;color:#b91c1c}
</style>
</head><body><main class="login-box"><div class="eyebrow">DATABASE SECURITY PLATFORM</div><h1>Welcome back</h1><p>Sign in to access your student or administrator dashboard.</p>
<label for="username">Username</label><input id="username" autocomplete="username" placeholder="Enter username">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
<button id="loginButton" onclick="login()">Sign in</button><div id="message" role="status"></div></main>
<script>
async function login(){const button=document.getElementById('loginButton'),message=document.getElementById('message');button.disabled=true;message.textContent='';try{const response=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Login failed');localStorage.setItem('dbis_token',data.token);localStorage.setItem('dbis_role',data.role);localStorage.setItem('dbis_user_id',data.user_id);if(data.role.toLowerCase()==='admin'){location.href='/dashboard'}else{location.href='/student?student_id='+encodeURIComponent(data.user_id)}}catch(error){message.textContent=error.message}finally{button.disabled=false}}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
